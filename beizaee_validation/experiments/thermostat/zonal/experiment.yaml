# Zonal Control Experiment Configuration
# Zone-specific thermostats with room-by-room manual schedules

# Experiment metadata
name: zonal_control
description: "Independent temperature schedules for each zone (room-by-room control)"

# Base configuration
base: ../shared
thermostat_control: thermostat_control.idf

# Always-include components (from old run_exps.py)
always_include:
  - people: shared/people.idf
  - equipment_gains: shared/equipment_gains.idf

# Mode-specific schedules (validation vs evaluation)
# validation = beizaee diary-based schedules
# evaluation = PIR sensor-based schedules
modes:
  validation:
    door_schedule: shared/door_schedule.idf  # beizaee door schedule
    occupancy_schedule: shared/occupancy_schedule.idf  # beizaee occupancy
  evaluation:
    door_schedule: occupancy/door_schedule.idf  # PIR-based door schedule
    occupancy_schedule: occupancy/occupancy_schedule.idf  # PIR-based occupancy

# Run periods (default: lynch)
run_periods:
  test: shared/run_period/test_run.idf  # 3-day test period
  beizaee: shared/run_period/beizaee_run.idf  # Beizaee validation period
  lynch: shared/run_period/lynch_run.idf  # Lynch validation period

# Boiler configuration (for parameter sweeps)
boiler:
  part_load:
    options:
      - 0_0: shared/boiler/part_load/minimum_part_load_0_0.idf
      - 0_2: shared/boiler/part_load/minimum_part_load_0_2.idf
      - 0_4: shared/boiler/part_load/minimum_part_load_0_4.idf
    default: 0_2

  efficiency:
    options:
      - constant: shared/boiler/efficiency/constant.idf
      - cubic: shared/boiler/efficiency/cubic.idf
      - quadratic: shared/boiler/efficiency/quadratic.idf
    default: quadratic

# Default run configuration
defaults:
  mode: evaluation
  run_period: lynch
  boiler_part_load: 0_2
  boiler_efficiency: quadratic
