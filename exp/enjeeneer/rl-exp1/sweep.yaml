program: main.py
project: bauwerk
name: sac-hyperparam-opt
method: bayes
metric:
  name: p_sac
  goal: maximize
parameters:
  layer_dims:
    distribution: categorical
    values: [64, 128, 256, 512]
  alpha:
    distribution: uniform
    min: 0.0001
    max: 0.005
  hist_length:
    distribution: categorical
    values: [0, 1, 3, 5]
  batch_size:
    distribution: categorical
    values: [64, 128, 256, 512]
  gamma:
    distribution: uniform
    min: 0.8
    max: 0.999
  tau:
    min: 0.001
    max: 0.3
  scale:
    values: [1, 2, 5, 20]