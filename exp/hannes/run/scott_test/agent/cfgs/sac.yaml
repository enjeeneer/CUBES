sac:
    obs_dim: ??? # to be specified later
    action_dim: ??? # to be specified later
    action_range: ??? # to be specified later
    device: cpu
    discount: 0.99
    init_temperature: 0.1
    alpha_lr: 3e-4
    alpha_betas: [0.9, 0.999]
    actor_lr: 3e-4
    actor_betas: [0.9, 0.999]
    actor_update_frequency: 1
    critic_lr: 3e-4
    critic_betas: [0.9, 0.999]
    critic_tau: 0.005
    critic_target_update_frequency: 1
    batch_size: 64
    learnable_temperature: true

critic:
    obs_dim: ${sac.obs_dim}
    action_dim: ${sac.action_dim}
    hidden_dim: 256
    hidden_depth: 2

actor:
    obs_dim: ${sac.obs_dim}
    action_dim: ${sac.action_dim}
    hidden_depth: 2
    hidden_dim: 256
    log_std_bounds: [-5, 2]

training:
    train_steps: 1e6
    replay_buffer_capacity: ${training.train_steps}
    num_seed_steps: 100
    eval_frequency: ???
    num_eval_episodes: 1
    episodes: ???
    device: ${sac.device}
    obs_dim: ${sac.obs_dim}
    action_dim: ${sac.action_dim}
    eval_steps: ???